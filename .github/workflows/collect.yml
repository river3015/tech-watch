name: Collect daily feeds
on:
  schedule:
    - cron: '17 22 * * *' # 07:17 JST (timing may be delayed by GitHub)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tech-watch-collect
  cancel-in-progress: false
jobs:
  collect:
    # Scheduling is opt-in; manual runs are also limited to the default branch.
    if: github.ref_name == github.event.repository.default_branch && (github.event_name == 'workflow_dispatch' || vars.TECH_WATCH_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - name: Collect and build
        id: collect
        run: python -m tech_watch run
      - name: Save archive
        if: steps.collect.outcome == 'success'
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'data: update daily tech digest'
            git push origin "HEAD:$TARGET_BRANCH"
          fi
      - name: Upload local site and collection reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tech-watch-preview
          path: |
            public/
            data/
          retention-days: 7
          if-no-files-found: error
      - name: Report partial collection failures
        if: steps.collect.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from tech_watch.collector import JST
          path = Path('data') / datetime.now(JST).strftime('%Y/%m/%d') / 'collection.json'
          report = json.loads(path.read_text())
          if report['failures']:
              raise SystemExit('Some feeds failed; successful results were saved. Check collection.json.')
          PY
